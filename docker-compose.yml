services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-campus_agent}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run python src/run_service.py
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      SQLITE_DB_PATH: /app/data/checkpoints.db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-campus_agent}
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run streamlit run src/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    environment:
      AGENT_URL: http://backend:8080
    depends_on:
      - backend
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.env:/app/.env:ro

volumes:
  postgres_data:
